# Pre-commit hooks (SEC-17, CQ-12). Install with:
#   pip install pre-commit && pre-commit install
# or: pipx run pre-commit install
#
# `typecheck` runs through the project's own `tsc` (node_modules), so the version
# always matches `make verify` / CI exactly — no separately-pinned mirror to drift.
#
# Revisions below are pinned to full commit SHAs (tag noted alongside); bump
# deliberately via a reviewed PR.
repos:
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck (tsc --noEmit)
        entry: npx --no-install tsc --noEmit
        language: system
        pass_filenames: false
        types: [ts]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
