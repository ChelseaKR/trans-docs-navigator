name: secret-scan-scheduled

# Gate 3 of SECURITY-AND-SUPPLY-CHAIN-STANDARD §"Secret scanning": a scheduled,
# full-history TruffleHog scan with live-credential verification. This complements
# ci.yml's gitleaks job (Gates 1+2, diff/push scans on every PR and push to main):
# TruffleHog additionally re-verifies any candidate secret against the API it looks
# like it belongs to, catching a credential that was committed and later removed from
# HEAD but is still live in git history and still valid. `--fail` exits non-zero on any
# verified-or-unknown finding, which fails this job (page on hit, per the standard).

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history — the whole point of the scheduled scan
          persist-credentials: false
      - name: TruffleHog (full history, verified + unknown creds)
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          path: ./
          # No base/head set: on schedule/workflow_dispatch the action scans the
          # entire reachable history, not just a commit range (see its action.yml).
          # `version` (the trufflehog CLI docker tag the action pulls) is deliberately
          # left at the action's default ("latest") rather than pinned to a release
          # number here: at pin time ghcr.io/trufflesecurity/trufflehog had not yet
          # published an image tag matching this action's v3.95.8 release, and pinning
          # to a stale numbered tag that silently drifts from the action version is
          # worse than the documented default. The *action* itself is SHA-pinned above;
          # Renovate/Dependabot will bump that SHA on a schedule.
          extra_args: --results=verified,unknown --fail
