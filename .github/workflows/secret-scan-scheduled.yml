name: secret-scan-scheduled

# Gate 3 of SECURITY-AND-SUPPLY-CHAIN-STANDARD §"Secret scanning": a scheduled,
# full-history TruffleHog scan with live-credential verification. This complements
# ci.yml's gitleaks job (Gates 1+2, diff/push scans on every PR and push to main):
# TruffleHog additionally re-verifies any candidate secret against the API it looks
# like it belongs to, catching a credential that was committed and later removed from
# HEAD. `--fail` exits non-zero on a finding in ANY of TruffleHog's three result
# tiers, which fails this job (page on hit, per the standard). All three is the
# point: a credential that leaked and was then revoked answers "no" to
# verification and is therefore `unverified`, so a scan that reported only
# `verified` and `unknown` could not fail on it (see the note on `extra_args`).

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the whole point of the scheduled scan
          persist-credentials: false
      - name: TruffleHog (full history, all result tiers)
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          # Pinned. The action's `version` input defaults to "latest" and it runs
          # `ghcr.io/trufflesecurity/trufflehog:${VERSION}`, so SHA-pinning the action
          # above does not pin what actually scans. That is how this gate changed
          # behaviour with no commit here: upstream published 3.96.0 and the next
          # run picked it up.
          #
          # The ref above and this input must name the SAME release, and
          # tests/secret-scan-workflow.test.ts fails the build when they do not.
          # They had drifted: the ref said v3.97.2 while this input downloaded
          # 3.96.0, because Dependabot rewrites `uses:` and never a `with:`
          # input -- so the bumps that moved the ref changed nothing about what
          # actually scanned. Resolved forward onto the ref. Every Dependabot
          # bump of the `uses:` pin therefore has to carry this input with it;
          # tests/secret-scan-workflow.test.ts is what stops one that does not.
          version: "3.97.4"
          # The note that used to sit here said `version` was deliberately left at
          # "latest" because ghcr.io had not yet published an image tag matching the
          # action's release, and that a stale numbered tag drifting from the action
          # version would be worse than the default. The first half of that premise
          # has expired: 3.96.0 is published and is what the default was already
          # pulling. The second half had it backwards. "latest" is the tag that
          # drifts, and it drifted: the gate changed behaviour with no commit here.
          # A numbered tag is visible in the diff when it moves.
          # `--fail` is not passed. The action's own command already includes it
          # and repeating a flag is a hard CLI error, so this scan exited 1 at
          # startup having read nothing: no chunk count, no findings, no coverage.
          #
          # `--results=verified,unknown,unverified` is load-bearing; the old
          # `--results=verified,unknown` could not fail on the case this job
          # exists for. TruffleHog sorts a finding into three tiers: `verified`
          # (it authenticated the credential against the live service),
          # `unknown` (verification errored out), and `unverified` (it asked,
          # and the service said no). A credential that leaked and was then
          # REVOKED -- the normal end state of a real leak, and precisely what a
          # scheduled full-history sweep is for -- answers "no", so it lands in
          # `unverified`, the one tier this scan was not reporting. Measured
          # 2026-09-06 on a throwaway clone of this repository, with a
          # real-shaped AWS key planted in one commit and deleted in the next
          # (confirmed present in history and absent at HEAD before each run):
          #
          #   --results=verified,unknown             exit 0,   0 reported
          #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
          #
          # `--only-verified` and `--results=verified` are the same hole under
          # other names.
          #
          # The usual argument for dropping the tier is committed placeholder
          # fixtures -- ledger's scan documents exactly that trade-off. It was
          # measured here rather than assumed: this repository's full history
          # (4,152 chunks, 8.9 MB, corpus included) reports 0 findings under the
          # widened tier, so widening costs nothing and needs no allowlist. If a
          # placeholder ever does fire, exclude that detector by name; do not
          # widen the hole back to a whole tier.
          extra_args: --results=verified,unknown,unverified
