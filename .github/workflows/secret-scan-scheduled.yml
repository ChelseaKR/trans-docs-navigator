name: secret-scan-scheduled

# Gate 3 of SECURITY-AND-SUPPLY-CHAIN-STANDARD §"Secret scanning": a scheduled,
# full-history TruffleHog scan with live-credential verification. This complements
# ci.yml's gitleaks job (Gates 1+2, diff/push scans on every PR and push to main):
# TruffleHog additionally re-verifies any candidate secret against the API it looks
# like it belongs to, catching a credential that was committed and later removed from
# HEAD but is still live in git history and still valid. `--fail` exits non-zero on any
# verified-or-unknown finding, which fails this job (page on hit, per the standard).

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the whole point of the scheduled scan
          persist-credentials: false
      - name: TruffleHog (full history, verified + unknown creds)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          # Pinned. The action's `version` input defaults to "latest" and it runs
          # `ghcr.io/trufflesecurity/trufflehog:${VERSION}`, so SHA-pinning the action
          # above does not pin what actually scans. That is how this gate changed
          # behaviour with no commit here: upstream published 3.96.0 and the next
          # run picked it up.
          version: "3.96.0"
          # The note that used to sit here said `version` was deliberately left at
          # "latest" because ghcr.io had not yet published an image tag matching the
          # action's release, and that a stale numbered tag drifting from the action
          # version would be worse than the default. The first half of that premise
          # has expired: 3.96.0 is published and is what the default was already
          # pulling. The second half had it backwards. "latest" is the tag that
          # drifts, and it drifted: the gate changed behaviour with no commit here.
          # A numbered tag is visible in the diff when it moves.
          # `--fail` is not passed. The action's own command already includes it
          # and repeating a flag is a hard CLI error, so this scan exited 1 at
          # startup having read nothing: no chunk count, no findings, no coverage.
          extra_args: --results=verified,unknown
