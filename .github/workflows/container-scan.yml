name: container-scan

# Container image CVE scan (SECURITY-AND-SUPPLY-CHAIN-STANDARD, backlog #11).
# Builds the production image and scans it with Trivy. A HIGH or CRITICAL,
# fixable OS/library vulnerability fails the job (BLOCKING via branch protection).
# Action refs are pinned by commit SHA (supply-chain hardening); the tag lives in
# the trailing comment for readability. Dependabot keeps the pins current.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/container-scan.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/container-scan.yml"

# Least privilege: this job only reads the repo to build the image.
permissions:
  contents: read

concurrency:
  # Key pull requests on the ref and pushes on the commit.
  #
  # A concurrency group holds one running run and one pending run. A third run
  # joining the group cancels the pending one before it dispatches a single job,
  # so that commit ends `cancelled` with zero jobs and no verdict at all. Keyed
  # only on `github.ref`, every push to the default branch shared one group with
  # the merge before it, so a burst of merges lost the middle ones.
  #
  # Measured 2026-09-05 over the 100 most recent runs on `main`: 11 ended
  # `cancelled`, 2 of them with zero jobs dispatched.
  #
  # Keying pushes on the SHA gives every merge its own group, so pushes never
  # contend. Pull requests keep the shared `-pr` key, so pushing again to a PR
  # still cancels the previous, now-irrelevant run; `cancel-in-progress` is left
  # exactly as it was, and is now unreachable for pushes.
  group: container-scan-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container
        # Same image the deploy path ships (Dockerfile at repo root).
        run: docker build -t trans-docs-navigator:scan .

      - name: Trivy image scan (BLOCKING on HIGH,CRITICAL)
        # Fails on fixable HIGH/CRITICAL CVEs in OS packages and app libraries.
        # ignore-unfixed avoids failing on vulns with no upstream fix available.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: trans-docs-navigator:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
