name: scorecard

# OpenSSF Scorecard (P1-2, SEC-36/37/38, CICD-03/11): a supply-chain-hygiene score
# (Pinned-Dependencies, Token-Permissions, Branch-Protection, Dangerous-Workflow,
# Vulnerabilities, …) computed monthly and on demand, published to the Security tab
# as SARIF (same Advanced-Security caveat as codeql.yml: SARIF upload to
# a *private* repo needs GitHub Advanced Security, so it's a no-op there, not a failure).
# The result is also uploaded as a build artifact so `docs/audits/scorecard-YYYY-MM.md`
# can be hand-transcribed from a real run each month (SEC-38).

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 5 11 * *" # monthly — re-armed 2026-07-11 (metrics plan Phase 0.2)

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # to upload SARIF (no-op via the guard below if repo is private)
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false # private repo — publishing requires a public repo

      - name: Upload Scorecard results as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90

      - name: Upload SARIF to Code Scanning
        # Same guard as codeql.yml: Advanced Security (required for code-scanning SARIF
        # upload on a private repo) is only free on public repos. No-op, not a failure,
        # if this repo is ever flipped private.
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
