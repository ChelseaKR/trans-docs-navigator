name: scorecard

# OpenSSF Scorecard (P1-2, SEC-36/37/38, CICD-03/11): a supply-chain-hygiene score
# (Pinned-Dependencies, Token-Permissions, Branch-Protection, Dangerous-Workflow,
# Vulnerabilities, …) computed monthly and on demand, published to the Security tab
# as SARIF. The Advanced-Security caveat below is conditional and does NOT currently
# apply: this repository is PUBLIC, and the SARIF upload is confirmed working — the
# 2026-09-06 run on `main` landed 3 analyses / 6 findings as `Scorecard`-tool code
# scanning alerts. The guard on the upload step is future-proofing in case the repo is
# ever flipped private, not a description of today.
#
# The result is also uploaded as a build artifact so `docs/audits/scorecard-YYYY-MM.md`
# can be hand-transcribed from a real run each month (SEC-38). CAVEAT for whoever does
# that transcription: Scorecard's SARIF carries only checks scoring BELOW maximum and
# has no aggregate field, so a score table CANNOT be read off this artifact — a check
# absent from the SARIF scored 10/10, it was not "unchecked". Use the CLI
# (`scorecard --repo=… --format=default`) for a real aggregate; see the `## 2026-09-06`
# section of docs/audits/scorecard-2026-07.md.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 5 11 * *" # monthly — re-armed 2026-07-11 (metrics plan Phase 0.2)

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # (#159) Every run since 2026-07-06 has failed at the "Run analysis" step with
    # `scorecard had an error: internal error: ListCommits: ... Resource not
    # accessible by integration` — the exact symptom ossf/scorecard-action's own
    # README documents under "Additional permissions for private repositories":
    # the default GITHUB_TOKEN needs these extra job-level READ scopes on a
    # private repo so Scorecard can query commits and detect configured SAST
    # tools via GraphQL. No PAT needed — this is a permissions fix, not a
    # settings-page one. (docs/audits/scorecard-2026-07.md's 5.8/10 came from a
    # local `scorecard` CLI run against live data, per its own header — this
    # fixes the separate, silently-broken CI automation meant to keep that
    # baseline current going forward.)
    permissions:
      contents: read
      security-events: write # to upload SARIF (no-op via the guard below if repo is private)
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # NOTE: the previous justification here ("private repo — publishing requires a
          # public repo") is factually wrong — this repository IS public, so publishing to
          # the OpenSSF public dataset is available. Left OFF rather than flipped, because
          # turning it on starts publishing to a third-party public dataset and enables the
          # Scorecard badge; that is the repo owner's call, not a silent side effect of a
          # documentation fix. To enable: change this to `true` (no other change needed).
          publish_results: false

      - name: Upload Scorecard results as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90

      - name: Upload SARIF to Code Scanning
        # Code-scanning SARIF upload is free on public repos and needs Advanced Security
        # on private ones. This repo is public, so this step RUNS and is verified working
        # (2026-09-06: 3 analyses uploaded, 6 findings). The guard only makes it a no-op
        # rather than a failure if the repo is ever flipped private.
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
