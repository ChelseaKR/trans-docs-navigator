name: release

# Tagged-release packaging (RELEASE-AND-VERSIONING-STANDARD + SECURITY-AND-SUPPLY-CHAIN
# §6). Previously this workflow ran ZERO gates on a tag push and published an unsigned,
# unverified `:latest`-tagged image — a bad or hostile tag could ship straight to
# `render.yaml`-deployable infrastructure. Fixed 2026-07-05 (P0-1 of the remediation plan):
#
#   version-check → verify → package (build, SBOM, schema-validate, cosign sign+attest,
#                                      SLSA provenance, publish by digest — never `:latest`)
#                          → verify-published (pull by digest, cosign verify, boot, /livez)
#
# Every job after version-check `needs:` the ones before it, so a bad/hostile tag cannot
# publish anything unless the tagged commit passes the identical `make verify` gate set
# that guards every merge to main, and nothing is considered "released" until the
# published, signed artifact has been independently pulled back down and proven to boot.
#
# Uses only GITHUB_TOKEN + keyless OIDC (Sigstore Fulcio/Rekor) — no long-lived
# credential, no repo secret to provision.
#
# Harden Runner (SEC-04, #158): 8 of `ci.yml`'s 9 jobs are `egress-policy: block`
# now, with allowlists mined from observed audit-mode runs (see its header) — the
# 9th, `container-and-infra`, stayed in `audit` for a specific, PR-CI-verified
# reason (a non-deterministic per-pull CDN redirect), also documented there.
# Every job below STAYS in `audit` too, and that is deliberate, not an oversight:
#
#   * This workflow has NEVER RUN — `git tag -l` is empty (see
#     docs/audits/scorecard-2026-07.md, "Signed-Releases: N/A"). There is no
#     completed run to mine an allowlist from; anything written here for cosign/
#     Sigstore/GHCR/the dataset publish path would be a guess dressed up as
#     evidence, which is exactly what audit-first is supposed to prevent.
#   * The failure mode here is the worst-timed one in the repo. This fires on a
#     pushed tag; a wrongly-blocked endpoint could fail AFTER the tag is public
#     and possibly mid-publish (an image partially pushed, a GitHub Release half
#     created). A false red is not a free retry here the way it is on a PR.
#
# The order is therefore: cut one real tagged release with these jobs in audit,
# read the observed endpoints off that run, and flip them to `block` in a
# follow-up PR. Tracked as the remaining part of #158.
#
# The `dataset` job (EXP-08) packages the corpus as a versioned, signed dataset bundle
# (schema + records + verifier roster + per-jurisdiction labels + hash manifest, see
# scripts/dataset-build.ts). It publishes the files on the tagged GitHub Release and
# attests them with keyless OIDC provenance. Release assets inherit repository
# visibility; while this repository is private, they are release-ready but not public.
# Like every shipped artifact, the dataset depends on version-check + full verification.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    name: tag matches package.json version (REL-03)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # Stays in audit — see the SEC-04 note in this file's header (#158).
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag ↔ package.json version consistency
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(jq -r .version package.json)"
          echo "tag=$GITHUB_REF_NAME → $tag_version   package.json=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (version $tag_version) does not match package.json version $pkg_version — bump package.json or retag"
            exit 1
          fi

  verify:
    name: re-verify at the tagged commit (REL-14/15)
    needs: [version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # Stays in audit — see the SEC-04 note in this file's header (#158).
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # This job publishes nothing itself, but it is the gate that AUTHORISES
          # publishing: `package`/`dataset` run only if this `make verify` is green
          # ("a tag can never publish an image that didn't earn a green make verify",
          # below). Restoring an untrusted package-manager cache here would let a
          # poisoned dependency produce that green verdict, so the cache-poisoning
          # concern applies to this job as much as to the privileged ones.
          # Flagged High by zizmor's cache-poisoning audit (workflow-sast, blocking).
          package-manager-cache: false
      - run: npm ci
      # make verify's last step (G9 pseudolocale overflow) drives a real browser.
      - name: Install Playwright Chromium (G9 pseudolocale overflow gate)
        run: npx playwright install --with-deps chromium
      # The exact same 25-stage blocking pipeline that guards every merge to main —
      # a tag can never publish an image that didn't earn a green `make verify`.
      - run: make verify

  package:
    name: build · SBOM · sign · attest · publish (GHCR, by digest — never :latest)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No caching in this job (SECURITY-AND-SUPPLY-CHAIN-STANDARD §6.4): caching in a
    # job that builds/signs/publishes/attests provenance violates SLSA build isolation.
    permissions:
      contents: read
      packages: write      # push image + attestation to GHCR
      id-token: write      # keyless cosign (SEC-29) + SLSA provenance OIDC
      attestations: write  # actions/attest-build-provenance
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # Stays in audit — see the SEC-04 note in this file's header (#158).
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image reference (GHCR requires lowercase; github.repository is not)
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Build image (tagged only vX.Y.Z — REL-18/SEC-29, no :latest ever)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          REF_NAME: ${{ github.ref_name }}
        run: docker build -t "$IMAGE:$REF_NAME" .

      - name: Push and capture the immutable digest
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          out="$(docker push "$IMAGE:$REF_NAME")"
          echo "$out"
          digest="$(echo "$out" | grep -oE 'sha256:[a-f0-9]{64}' | head -1)"
          if [ -z "$digest" ]; then
            echo "::error::could not parse the pushed image digest from docker push output"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published: $IMAGE@$digest"

      - name: SBOM (CycloneDX, generated from the published digest)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-${{ github.ref_name }}.cdx.json

      - name: Validate SBOM against the CycloneDX schema (SEC-27) — fail on schema error
        run: |
          docker run --rm -v "$PWD":/wrk -w /wrk \
            cyclonedx/cyclonedx-cli@sha256:dc5a886c592c49076ce09079433e961be94f1bb8521f837c1467b585b33f67e1 \
            validate --input-file sbom.cdx.json --fail-on-errors

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: cosign sign the image (keyless — Fulcio cert + Rekor log, no long-lived key)
        run: cosign sign --yes "${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: cosign attest the SBOM (CycloneDX predicate, keyless)
        run: cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Attest SLSA build provenance (SLSA Build L2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  verify-published:
    name: verify-published — pull by digest, cosign verify, boot, /livez (REL-16)
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # Stays in audit — see the SEC-04 note in this file's header (#158).
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR (read)
        env:
          GHCR_USER: ${{ github.actor }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: cosign verify (keyless — matches this repo's GitHub Actions OIDC identity)
        env:
          DIGEST: ${{ needs.package.outputs.digest }}
          IMAGE: ${{ needs.package.outputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY}/" \
            "$IMAGE@$DIGEST"

      - name: Pull the published image BY DIGEST (never a mutable tag) and boot it
        env:
          DIGEST: ${{ needs.package.outputs.digest }}
          IMAGE: ${{ needs.package.outputs.image }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker run -d --name release-check -p 8080:8080 "$IMAGE@$DIGEST"

      - name: Wait for health, then prove /livez responds on the real published artifact
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/livez
          echo
          docker logs release-check

      - name: Stop the container
        if: always()
        run: docker rm -f release-check || true

  # Versioned, signed dataset release (EXP-08). No new deps: the build script
  # is native `node --experimental-strip-types` reusing api/corpus.ts's fail-closed
  # validator. Provenance is keyless (GitHub OIDC) — no secrets, only the two extra
  # permissions below (job-scoped; they do not widen the `package` job above).
  dataset:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create/update the tagged GitHub Release assets
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # This job was missing a Harden Runner step entirely (found while doing
        # #158) — a real gap, not a style choice: it is the one job in this
        # workflow that writes to the repo (`contents: write`, GitHub Release
        # assets) with zero egress monitoring. Stays in audit for the same
        # never-run reason as every other job here — see this file's header.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # This privileged tag job publishes release assets; never restore an
          # untrusted package-manager cache into it (zizmor cache-poisoning audit).
          package-manager-cache: false
      - name: Build dataset release bundle
        run: node --experimental-strip-types scripts/dataset-build.ts dist/dataset
      - name: Attest build provenance (keyless, OIDC)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/dataset/*"
      - name: Publish versioned dataset files on the tagged GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/dataset/* --clobber
          else
            gh release create "$TAG" dist/dataset/* --verify-tag --title "$TAG" --generate-notes
          fi
      - name: Upload dataset artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataset-${{ github.ref_name }}
          path: dist/dataset/
