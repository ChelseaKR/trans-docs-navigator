name: content-watch

# Weekly content operations (PRODUCTIONIZATION-PLAN Phase 3). Three checks, none
# merge-blocking — their job is to convert content drift into a GitHub issue a human
# can act on, never to change content automatically:
#   1. link-check        — does every cited source URL still resolve?
#   2. source-watch      — has any source page's content changed since its baseline?
#   3. freshness (live)  — does any record expire its SLA within the next 14 days,
#                          evaluated against TODAY's date (the merge gate pins its date
#                          for determinism; this run is the calendar-true sweep)?

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: content-watch
  cancel-in-progress: false

jobs:
  content-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Link-rot check
        id: links
        continue-on-error: true
        run: make link-check 2>&1 | tee link-check.out
      - name: Source-change detection
        id: sources
        continue-on-error: true
        run: make source-watch 2>&1 | tee source-watch.out
      - name: Freshness against the real calendar
        id: freshness
        continue-on-error: true
        run: NAV_TODAY=$(date +%F) node --experimental-strip-types --no-warnings scripts/freshness.ts 2>&1 | tee freshness.out
      - name: Open an issue when anything needs a human
        if: steps.links.outcome == 'failure' || steps.sources.outcome == 'failure' || steps.freshness.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const read = (f) => { try { return fs.readFileSync(f, 'utf8').trim(); } catch { return '(no output)'; } };
            const date = new Date().toISOString().slice(0, 10);
            const title = `content-watch: sources need human attention (${date})`;
            // One issue per week at most: skip if an open content-watch issue already exists.
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'content-watch' });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number,
                body: `Still failing on ${date}. Latest link-check:\n\n\`\`\`\n${read('link-check.out')}\n\`\`\`` });
              return;
            }
            const body = [
              'The weekly content sweep found drift that needs a human re-verification pass.',
              'Nothing was changed automatically; degraded records keep serving with their freshness warning.',
              '', '## link-check', '```', read('link-check.out'), '```',
              '', '## source-watch', '```', read('source-watch.out'), '```',
              '', '## freshness (live date)', '```', read('freshness.out'), '```',
              '', 'Runbook: re-verify each named record against its official source, update `last_verified`',
              'and the URL if it moved, then run `make source-baseline` and `make verify`.',
            ].join('\n');
            await github.rest.issues.create({ ...context.repo, title, body, labels: ['content-watch'] });
