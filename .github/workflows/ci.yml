name: ci

# The blocking enforcement pipeline (QUALITY-AND-METRICS-STANDARD §"enforcement
# pipeline"). A merge to main requires every job green; branch protection enforces it.
# Action refs are pinned by commit SHA (supply-chain hardening); the tag is in the
# comment for readability. Dependabot keeps the pins current.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # `audit` logs outbound egress without blocking (P1-3): a first step over
        # every job here so the actual domain set can be observed before this ever
        # flips to `block` with an explicit allowlist.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm # restore ~/.npm so `npm ci` skips the network on cache hit
      - run: npm ci
      # G9 pseudolocale overflow (below) drives a real browser via Playwright, so
      # `make verify` needs Chromium. Keeps local == CI (both run the full make verify).
      - name: Install Playwright Chromium (G9 pseudolocale overflow gate)
        run: npx playwright install --with-deps chromium
      # The full local gate set: lint, typecheck, tests+coverage, security,
      # content, citation coverage, privacy, freshness, disclosure, readability,
      # i18n UTF-8 (G1) + BCP-47 tag validity (G3) + locale key-parity (G6, EN/ES)
      # + logical-CSS (G10 static, stylelint use-logical), a11y (mechanical), seo,
      # eval, and the G9 pseudolocale overflow gate (Playwright, desktop + mobile).
      # (G4 html-lang is also enforced by the a11y-browser job below via pa11y-ci.)
      - run: make verify
      - name: Upload committed audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-reports
          path: docs/audits/

  smoke-journey:
    # Real-server synthetic journey: intake → checklist → packet → form-fill in EN+ES,
    # all static assets, and the strict CSP on every HTML response. Catches the failure
    # modes render-level tests can't (header regressions, 404ing assets, CSP lockouts).
    # D2's real-browser sibling additionally executes the on-device copy and encrypted
    # resume modules against the production server and asserts that those interactions
    # issue no network requests.
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # `audit` logs outbound egress without blocking (P1-3): a first step over
        # every job here so the actual domain set can be observed before this ever
        # flips to `block` with an explicit allowlist.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm # restore ~/.npm so `npm ci` skips the network on cache hit
      - run: npm ci
      - run: make smoke
      - name: Install Playwright Chromium (D2 real-browser journey)
        run: npx playwright install --with-deps chromium
      - run: make e2e-journey

  a11y-browser:
    # Real-browser accessibility gate (BLOCKING). Covers the ~60–70% of WCAG that the
    # static linter cannot (axe + HTML_CodeSniffer in a real browser). The remaining
    # manual screen-reader / keyboard / 200%-zoom walkthrough stays review-gated and is
    # signed off in docs/audits/accessibility-YYYY-MM-DD.md.
    # (The G9 pseudolocale overflow gate — INTERNATIONALIZATION-STANDARD §4 — is the
    # sibling real-browser i18n check; it runs in the `verify` job above via `make verify`.)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # `audit` logs outbound egress without blocking (P1-3): a first step over
        # every job here so the actual domain set can be observed before this ever
        # flips to `block` with an explicit allowlist.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm # restore ~/.npm so `npm ci` skips the network on cache hit
      - run: npm ci
      - name: Start server
        run: |
          NODE_ENV=test PORT=8080 node --experimental-strip-types api/server.ts &
          npx --yes wait-on http://localhost:8080/healthz
      - name: pa11y-ci (axe-core + htmlcs, zero violations)
        # Explicit URL list in .pa11yci.json (the app serves no sitemap). Zero-violation
        # threshold; a violation fails the job. Required check via branch protection.
        # Chromium runs with --no-sandbox (.pa11yci.json) since GitHub runners have no
        # user namespaces for the Chrome sandbox.
        run: npx --yes pa11y-ci --config .pa11yci.json

  lighthouse:
    # Lighthouse CI (P1-4, A11Y-02, OBS-23/24/25): lab-measured a11y ≥0.95, perf ≥0.90,
    # and Core-Web-Vitals-shaped budgets (LCP ≤2.5s, CLS ≤0.1, TBT ≤200ms as the lab
    # proxy for INP — INP itself is a field/RUM metric and this repo deliberately ships
    # no RUM, see docs/ROADMAP.md "## Observability"). `.lighthouserc.json` sets
    # `throttlingMethod: provided` (i.e. NO simulated mobile-CPU throttling): this app
    # ships literally zero required JS on these routes, and Lighthouse's default
    # *simulated* throttling was measured (2026-07-05) to produce a noisy, misleading
    # Total-Blocking-Time spike on shared/contended hardware that has nothing to do with
    # this page's real cost. Measuring the real (unthrottled) main-thread cost is the
    # honest, deterministic signal for this specific app shape — same philosophy as the
    # in-process `scripts/latency-bench.ts` guard preferring determinism over
    # network/host variability. Real regressions (shipping heavy JS) still show up here.
    #
    # Sharded one-URL-per-job (2026-09, measured before 33949872350: this job alone was
    # 7.4 of the workflow's 7.5 total wall-clock minutes, 403s of which was the single
    # "Lighthouse CI" step running 6 URLs × numberOfRuns 3 = 18 page loads back to back).
    # Each matrix leg below overrides ONLY `--collect.url` on the CLI; `.lighthouserc.json`
    # is untouched — same 6 URLs, same numberOfRuns: 3, same assertion thresholds. Verified
    # against this repo's pinned @lhci/cli@0.15.1 that a CLI-provided `--collect.url`
    # replaces (not appends to) the rc file's `collect.url` array, since yargs' `.config()`
    # treats the rc file as defaults that an explicit flag overrides — so each leg still
    # runs the full 3-run median for its one URL against the unweakened gate, just
    # concurrently with the other 5 instead of serially after them.
    name: lighthouse (${{ matrix.target.slug }})
    strategy:
      fail-fast: false # surface every failing URL in one run, not just the alphabetically-first
      matrix:
        target:
          - slug: home
            path: "/"
          - slug: home-es
            path: "/?language=es"
          - slug: checklist
            path: "/checklist?jurisdiction=US-CA&change=name&change=gender-marker"
          - slug: packet
            path: "/packet?jurisdiction=US-CA&change=name"
          - slug: terms
            path: "/terms"
          - slug: guide-ca-name-change
            path: "/guide/california/name-change"
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm # restore ~/.npm so `npm ci` skips the network on cache hit
      - run: npm ci
      - name: Start server
        run: |
          NODE_ENV=test PORT=8080 node --experimental-strip-types api/server.ts &
          npx --yes wait-on http://localhost:8080/healthz
      - name: Lighthouse CI (BLOCKING — see .lighthouserc.json)
        env:
          LH_TARGET_URL: "http://localhost:8080${{ matrix.target.path }}"
        run: npx --yes @lhci/cli@0.15.1 autorun --collect.url="$LH_TARGET_URL"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports-${{ matrix.target.slug }}
          path: lighthouseci-reports/

  lighthouse-summary:
    # Single stable check name for the sharded stage above. A matrix reports each leg
    # as its own check ("lighthouse (home)", "lighthouse (checklist)", ...) instead of
    # one "lighthouse" — this job exists so that name still exists too, as one check
    # whose result is the AND of all 6 legs. `lighthouse` is not in branch protection's
    # required_status_checks today (verify, smoke-journey, a11y-browser, security-sast,
    # container-and-infra are), so nothing there needs to change for this PR — but if
    # `lighthouse` is ever made required, point the rule at this job, not at one leg.
    # `if: always()` + an explicit result check so a cancelled/skipped matrix reads as
    # a failure here rather than a silently-green summary: a gate that didn't run must
    # not read as a gate that passed (PR #118).
    name: lighthouse
    needs: lighthouse
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Require every lighthouse URL shard to have passed
        env:
          LH_MATRIX_RESULT: ${{ needs.lighthouse.result }}
        run: |
          if [ "$LH_MATRIX_RESULT" != "success" ]; then
            echo "::error::lighthouse matrix result was '$LH_MATRIX_RESULT' (expected 'success') — at least one URL shard failed, was skipped, or was cancelled."
            exit 1
          fi
          echo "All 6 lighthouse URL shards passed."

  security-sast:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # `audit` logs outbound egress without blocking (P1-3): a first step over
        # every job here so the actual domain set can be observed before this ever
        # flips to `block` with an explicit allowlist.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep SAST (BLOCKING)
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/typescript p/owasp-top-ten
        # Blocking: a SAST finding fails the job (required check via branch protection).

  secret-scan:
    # Gate 1+2 of SECURITY-AND-SUPPLY-CHAIN-STANDARD §"Secret scanning": gitleaks CI
    # scan (diff on PR via the action's own base/head detection, full history on push
    # to main), --redact'd, blocking (no `|| true`, no continue-on-error). This
    # replaces the 3-regex grep in scripts/security-scan.ts as the real secret-scanning
    # control for the portfolio's highest-stakes privacy repo (SEC-17/18). Gate 3
    # (scheduled TruffleHog full-history, verified-creds mode) is `secret-scan-scheduled.yml`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the pull_request scan: gitleaks-action resolves the PR's commit
      # range through `GET /repos/{owner}/{repo}/pulls/{n}/commits`, which 403s on a
      # private repo without this scope. This is the only scope added, and it is read —
      # gitleaks-action would also try to *comment* a finding on the PR, which needs
      # write; GITLEAKS_ENABLE_COMMENTS below turns that off instead, so no write scope
      # is granted anywhere in this job. The failing step is the signal, not a comment.
      pull-requests: read
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # `audit` logs outbound egress without blocking (P1-3): a first step over
        # every job here so the actual domain set can be observed before this ever
        # flips to `block` with an explicit allowlist.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks needs full history to scan, not just the merge commit
          persist-credentials: false
      # Runs on pull_request too, as of 2026-08-01. It used to carry
      # `if: github.event_name != 'pull_request'` in order to hold the job's token at
      # `contents: read` — but the effect was that a secret introduced in a PR was not
      # caught until it had already merged to main, on the repo the standard calls the
      # portfolio's highest-stakes privacy repo. The `secret-scan` check went green on
      # every PR having scanned nothing. `pull-requests: read` above buys the PR scan
      # back for one read-only scope.
      - name: gitleaks (BLOCKING secret scan)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # no PR comments, so no write scope is needed

  workflow-sast:
    if: github.event_name != 'pull_request'
    # zizmor — static analysis of the workflow YAML itself (CICD-19, RTF-06): catches
    # things Semgrep/CodeQL don't, e.g. a mutable-ref `uses:`, an unpinned action,
    # unnecessary `persist-credentials: true`, over-broad `permissions:`, template
    # injection via `${{ }}` in a `run:` block, and `pull_request_target` misuse.
    # `advanced-security: false` + `annotations: true` keeps this job read-only
    # (contents: read) instead of needing `security-events: write` + GitHub Advanced
    # Security (which, per codeql.yml, is unavailable on a private personal repo).
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # `audit` logs outbound egress without blocking (P1-3): a first step over
        # every job here so the actual domain set can be observed before this ever
        # flips to `block` with an explicit allowlist.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (BLOCKING on High/Critical findings)
        run: |
          python -m pip install --upgrade pip zizmor
          zizmor --offline --min-severity high .github/workflows/

  container-and-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (egress audit — SEC-04)
        # `audit` logs outbound egress without blocking (P1-3): a first step over
        # every job here so the actual domain set can be observed before this ever
        # flips to `block` with an explicit allowlist.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build container
        run: docker build -t trans-docs-navigator:ci .
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.5"
      - name: Terraform validate (production skeleton + cost-light preview)
        run: |
          for dir in infra infra/preview; do
            echo "── $dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" fmt -check
          done
