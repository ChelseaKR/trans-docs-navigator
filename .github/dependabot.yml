# Keep the (deliberately tiny) dependency surface and the SHA-pinned actions current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for the whole CodeQL action set: init, analyze, autobuild and
    # upload-sarif must always run the same version. Since CodeQL Action
    # 3.30.4 the non-init steps hard-error when they load a configuration
    # file written by a different version, so a half-applied bump breaks the
    # scan rather than merely warning.
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

# There is deliberately no `pip` (or `uv`) entry here.
#
# GitHub runs a job of its own against this repo — `dynamic/dependabot/update-graph`,
# titled "Graph Update: pip in /corpus/snapshots" — which has failed all 7 of its runs
# (2026-07-14 → 2026-09-06) and never passed. It reads three corpus snapshots whose
# URL-derived names contain "requirements" as pip requirements files. That job is created
# by GitHub's manifest detection, not by this file: it already runs even though nothing
# here declares pip. Adding a pip entry would therefore not silence it — it would add a
# second, weekly version-update job with no manifests to update.
#
# `exclude-paths` does not reach it either. GitHub documents it as "Version updates only",
# and dependabot-core PR #15148 ("Honor exclude_paths in graph jobs") is still open. The
# snapshots are not renamed because their names are their provenance.
#
# The full, dated finding is in README.md's Standards-conformance CI/CD row, and
# tests/dependabot-pip-graph.test.ts fails if a real Python manifest ever lands here, so a
# genuinely new pip failure cannot hide behind the known one. Issue #265.
